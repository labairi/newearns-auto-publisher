name: render-check (temporary)
on:
  push:
    branches: [claude/project-thread-lhf4i6]
    paths: [".github/render-check/**", ".github/workflows/render-check.yml"]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python .github/render-check/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-check
          path: render-check-out/
