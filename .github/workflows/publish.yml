name: publisher

# Manual runs, plus one scheduled run a day at 11:00 Morocco time (approved by the
# owner on 2026-10-21). The scheduled run picks the next approved calendar topic and
# publishes it live only if every quality gate passes; otherwise it is saved as
# Pending Review. It skips, with no Claude call, if any attempt happened in the last
# 20 hours or the last 2 attempts failed.
# To stop it: Actions > publisher > "..." > Disable workflow.
on:
  schedule:
    # GitHub cron is always UTC. Morocco has been on UTC+0 all year, with no daylight
    # saving and no Ramadan change, since 2026-09-20, so 11:00 Morocco = 11:00 UTC.
    # If Morocco changes its clocks again, both lines must change.
    # Off the hour on purpose: GitHub delays or drops top-of-hour schedules under load
    # (on 2026-10-22..26 the 11:00/11:30 runs arrived 3-5 hours late).
    - cron: "7 11 * * *"    # 11:07 Morocco time
    - cron: "37 11 * * *"   # backup if GitHub drops the 11:07 run; skips (free) after a run
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        default: check-setup
        options:
          - check-setup        # read-only: credentials, role, categories
          - article-dry-run    # generate + quality checks, nothing sent to WordPress
          - article            # uses publishing.mode from config.yaml (draft by default)
          - recheck            # re-run quality gates on a saved article file; no WordPress writes
          - resume-schedule    # let scheduled runs continue after 2 unsuccessful attempts paused them
          - image-test-draft   # images for a saved article (article_file) -> one WordPress draft; no Claude cost
          - daily              # exactly what the cron runs (same guards); for an outside daily call when GitHub's cron is late
      article_file:
        description: "For recheck / image-test-draft: path to a saved article JSON, or a run's data/runs/<id>/state.json"
        type: string
        default: ""
      refresh_fact_check:
        description: "For recheck: re-run only the fact-check on the edited text (Claude API cost; no new article)"
        type: boolean
        default: false
      pillar:
        description: "For article / article-dry-run: pillar of the calendar topic"
        type: choice
        default: none
        options:
          - none
          - pdf
          - instagram
          - money
          - passive
          - ai
      topic:
        description: "For article / article-dry-run: exact topic title from the calendar in config.yaml"
        type: string
        default: ""
      allow_publish:
        description: "Publish live if every quality gate passes (article command on main only)"
        type: boolean
        default: false

concurrency:
  group: publisher
  cancel-in-progress: false

permissions:
  contents: write   # commit the publication log back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}   # optional, free; Openverse is used without it
      # Second safety key for live publishing: "true" only on main, for a scheduled
      # or `daily` run, or for an `article` run with the allow_publish box ticked. Every other run
      # stays "false".
      ALLOW_PUBLISH: ${{ (github.event_name == 'schedule' || inputs.command == 'daily' || (inputs.command == 'article' && inputs.allow_publish)) && github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch as it is when the job starts, not when the run was queued, so a run
          # that waited in the concurrency group sees the log the previous run pushed.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ARTICLE_FILE: ${{ inputs.article_file }}
          REFRESH: ${{ inputs.refresh_fact_check }}
          PILLAR: ${{ inputs.pillar }}
          TOPIC: ${{ inputs.topic }}
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.command }}" = daily ]; then
            python -m publisher.run article --scheduled
            exit
          fi
          plan=()
          refresh=()
          [ "$REFRESH" = true ] && refresh=(--refresh-fact-check)
          [ "$PILLAR" = none ] && PILLAR=""
          if [ -n "$PILLAR$TOPIC" ]; then plan=(--pillar "$PILLAR" --topic "$TOPIC"); fi
          case "${{ inputs.command }}" in
            check-setup)      python -m publisher.run check-setup ;;
            article-dry-run)  python -m publisher.run article --dry-run "${plan[@]}" ;;
            article)          python -m publisher.run article --resume "${plan[@]}" ;;
            recheck)          python -m publisher.run article --dry-run --article-file "$ARTICLE_FILE" "${refresh[@]}" ;;
            resume-schedule)  python -m publisher.run resume-schedule ;;
            image-test-draft) python -m publisher.run image-test --article-file "$ARTICLE_FILE" ;;
          esac
      - name: Save publication log and checkpoints
        if: always() && inputs.command != 'check-setup'
        run: |
          git config user.name "newearns-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "publisher: ${{ inputs.command || 'scheduled' }} run ${{ github.run_id }}"
          git push
